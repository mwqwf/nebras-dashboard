# لغة JVM إنجليزية إلزامياً أثناء البناء: على نظام عربي تُولّد bundletool
# أسماء dex بأرقام عربية-هندية (classes٢.dex) فيفشل packageReleaseBundle.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true

# Kotlin daemon يفشل بالاتصال على هذا الجهاز (4 محاولات ثم fallback بطيء).
# التنفيذ داخل عملية Gradle نفسها يوفّر دقائق على كل بناء.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
